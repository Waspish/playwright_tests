name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose tests set
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all

permissions:
  pages: write
  contents: read
  id-token: write
  # actions: read      # для скачивания артефактов
  # actions: write нужен для загрузки артефакта истории, но upload-artifact сам использует GITHUB_TOKEN,
  # достаточно permissions: actions: write? На самом деле для upload-artifact не нужно отдельное permission,
  # действует permissions: contents? Но добавим actions: write для надёжности
  # Лучше указать actions: write — он разрешает и чтение и запись артефактов
  # Однако для скачивания через API нужен actions: read, для загрузки через actions/upload-artifact достаточно actions: write
  # Укажем и то и другое:
  actions: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v5

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: 'pypy3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install

      - name: Create allure-results dir
        run: mkdir allure-results

      - name: Run all tests
        if: github.event.inputs.deployment_target == 'all'
        run: pytest --alluredir=allure-results
        continue-on-error: true

      - name: Run smoke tests
        if: github.event.inputs.deployment_target == 'smoke'
        run: pytest -m smoke --alluredir=allure-results
        continue-on-error: true

      - name: Run regression tests
        if: github.event.inputs.deployment_target == 'regression'
        run: pytest -m regression --alluredir=allure-results
        continue-on-error: true

      - name: Run extended tests
        if: github.event.inputs.deployment_target == 'extended'
        run: pytest -m extended --alluredir=allure-results
        continue-on-error: true

      - name: Upload allure results
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results
          retention-days: 30

  generate-report:
    runs-on: ubuntu-latest
    name: Generate report
    needs: run-tests
    steps:
      - name: Download allure results
        uses: actions/download-artifact@v6
        with:
          name: allure-results
          path: allure-results

      - name: Download previous Allure history (if exists)
        id: download-history
        continue-on-error: true
        run: |
          # Ищем последний артефакт с именем "allure-history"
          ARTIFACT_ID=$(curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=allure-history" \
            | jq -r '.artifacts | sort_by(.created_at) | last(.[]).id // empty')
          
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Предыдущая история не найдена. Будет создана новая."
            mkdir -p allure-results/history
            exit 0
          fi
          
          echo "Найден артефакт истории с ID: $ARTIFACT_ID"
          curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o history.zip
          
          unzip -q history.zip -d history_extracted
          # Внутри архива лежит папка history, перемещаем её в allure-results
          if [ -d history_extracted/history ]; then
            cp -r history_extracted/history allure-results/
          else
            # альтернативно: если структура иная, ищем папку history
            find history_extracted -type d -name "history" -exec cp -r {} allure-results/ \;
          fi
          rm -rf history_extracted history.zip

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Install Allure
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          sudo tar -xzf allure-2.34.1.tgz -C /opt/
          sudo ln -s /opt/allure-2.34.1/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: allure generate -c allure-results -o _site

      - name: Save report as artifact
        uses: actions/upload-artifact@v5
        with:
          name: _site
          path: _site
          retention-days: 30

      - name: Save Allure history for future runs
        uses: actions/upload-artifact@v5
        with:
          name: allure-history
          path: _site/history
          retention-days: 90   # сохраняем дольше, чтобы история не терялась

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v6
        with:
          name: _site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
