name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose tests set
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pages: write
  contents: read
  id-token: write
  actions: read   # для скачивания артефактов через GITHUB_TOKEN

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: playwright install
      - name: Create allure-results
        run: mkdir -p allure-results
      - name: Run tests
        run: |
          MARKER="${{ github.event.inputs.deployment_target }}"
          if [ "$MARKER" = "all" ]; then
            pytest --alluredir=allure-results
          else
            pytest -m "$MARKER" --alluredir=allure-results
          fi
        continue-on-error: true
      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30

  generate-report:
    runs-on: ubuntu-latest
    name: Generate and publish report
    needs: run-tests
    steps:
      - name: Download raw results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Download previous Allure history (if exists)
        run: |
          ARTIFACT_ID=$(curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=allure-history" \
            | python3 -c "import sys, json; data = json.load(sys.stdin); artifacts = data.get('artifacts', []); valid = [a for a in artifacts if not a.get('expired', False)]; valid.sort(key=lambda x: x['created_at'], reverse=True); print(valid[0]['id'] if valid else '')")
          
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Найден предыдущий артефакт истории с ID: $ARTIFACT_ID"
            curl -L -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              -o history.zip
            unzip -q history.zip -d history_extracted
            HISTORY_DIR=$(find history_extracted -type d -name "history" | head -1)
            if [ -n "$HISTORY_DIR" ]; then
              cp -r "$HISTORY_DIR" allure-results/
              echo "История подложена в allure-results/history"
            else
              echo "В артефакте не найдена папка 'history'"
            fi
            rm -rf history_extracted history.zip
          else
            echo "Предыдущая история не найдена, начинаем с нуля"
          fi

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - name: Install Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          sudo tar -xzf allure-2.34.1.tgz -C /opt/
          sudo ln -s /opt/allure-2.34.1/bin/allure /usr/bin/allure
      - name: Generate Allure report
        run: allure generate -c allure-results -o _site --clean
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 30
      - name: Save history for future runs
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: _site/history
          retention-days: 90

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: _site
          path: _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
